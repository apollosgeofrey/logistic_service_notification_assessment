version: '3.8'

services:
  app:
    build: .
    container_name: notification_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - pgsql
      - redis
    volumes:
      - .:/var/www/html

  pgsql:
    image: postgres:15
    environment:
      POSTGRES_DB: notification_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
