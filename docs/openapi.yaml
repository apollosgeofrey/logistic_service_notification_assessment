openapi: 3.0.3
info:
  title: Notification Service API
  description: |
    Bulk SMS/Email notification microservice with priority queues, delivery status tracking,
    idempotency, and automatic retries.

    All bulk-send requests require a unique `Idempotency-Key` header.
  version: 1.0.0
  contact:
    name: Apollos Geofrey
    email: apollosgeofrey@gmail.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Notifications
    description: Bulk send and status queries
  - name: Subscribers
    description: Subscriber notification history

paths:
  /notifications/bulk-send:
    post:
      tags: [Notifications]
      summary: Start a bulk notification send
      description: |
        Creates one notification per subscriber and dispatches async delivery jobs.
        Critical messages are routed to the highest-priority queue.
      operationId: bulkSendNotifications
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSendRequest'
            examples:
              criticalEmail:
                summary: Critical email verification
                value:
                  channel: email
                  content: "Your verification code is 1234"
                  priority: critical
                  subscriber_ids: [1]
              marketingSms:
                summary: Marketing SMS
                value:
                  channel: sms
                  content: "Summer sale starts today!"
                  priority: marketing
                  subscriber_ids: [2, 3]
      responses:
        '202':
          description: Notifications accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSendResponse'
        '409':
          description: Idempotency key reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error or missing idempotency header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get notification status
      operationId: getNotificationStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Notification details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subscribers/{id}/notifications:
    get:
      tags: [Subscribers]
      summary: List notifications for a subscriber
      operationId: listSubscriberNotifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sent, delivered, discarded]
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [email, sms]
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated notification history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPaginatedResponse'
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per bulk-send request. Reusing the key returns the original response.
      schema:
        type: string
        example: 7f2f3a4e-8c1d-4b2a-9f0e-123456789abc

  schemas:
    BulkSendRequest:
      type: object
      required: [channel, content, priority, subscriber_ids]
      properties:
        channel:
          type: string
          enum: [email, sms]
        content:
          type: string
          example: Your verification code is 1234
        priority:
          type: string
          enum: [critical, default, marketing]
          description: Critical messages are processed before marketing traffic.
        subscriber_ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 3]

    Notification:
      type: object
      properties:
        id:
          type: integer
          example: 10
        subscriber_id:
          type: integer
          example: 1
        batch_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms]
        content:
          type: string
        priority:
          type: string
          enum: [critical, default, marketing]
        status:
          type: string
          enum: [queued, sent, delivered, discarded]
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        external_id:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BulkSendResponse:
      type: object
      properties:
        idempotency_key:
          type: string
        batch_id:
          type: string
          format: uuid
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    NotificationPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        links:
          type: object
        meta:
          type: object

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
